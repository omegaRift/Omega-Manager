<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Omega Manager alert</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #d32f2f; color: #fff; overflow: hidden; user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  .card { position: relative; padding: 14px 16px 14px 18px; border: 2px solid #ff8a80; animation: glow 1.2s ease-in-out 6; }
  @keyframes glow { 50% { border-color: #ffffff; background: #e53935; } }
  .head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #ffe1de; -webkit-app-region: drag; }
  .head svg { width: 18px; height: 18px; flex: none; animation: ring 0.5s ease-in-out 6; transform-origin: 50% 10%; }
  @keyframes ring { 25% { transform: rotate(14deg); } 75% { transform: rotate(-14deg); } }
  .head .when { margin-left: auto; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .close { -webkit-app-region: no-drag; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; margin-right: -6px; }
  .close:hover { background: rgba(0, 0, 0, .18); }
  .title { font-size: 19px; font-weight: 700; margin: 8px 0 4px; line-height: 1.25; overflow-wrap: anywhere; }
  .msg { font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }
  .msg:empty { display: none; }
  .late { margin-top: 6px; font-size: 12.5px; color: #ffe1de; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.b { height: 32px; padding: 0 12px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; border: 1px solid rgba(255, 255, 255, .7); background: transparent; color: #fff; }
  button.b:hover { background: rgba(255, 255, 255, .14); }
  button.b.main { margin-left: auto; background: #fff; color: #b71c1c; border-color: #fff; font-weight: 700; }
  button.b.main:hover { background: #ffe9e7; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
    <span id="kind">Timer done</span>
    <span class="when" id="when"></span>
    <button class="close" id="x" title="Dismiss" aria-label="Dismiss"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="title" id="title"></div>
  <div class="msg" id="msg"></div>
  <div class="late" id="late" hidden></div>
  <div class="actions" id="actions"></div>
</div>
<script src="alert.js"></script>
</body>
</html>
